:root{
  --night:#120f1c;--panel:rgba(22,19,36,.94);--panel2:#2a2440;--cream:#f6efe0;--muted:#c2b9d2;--ember:#ef5a43;--tide:#4b8df0;
  --gold:#e8b84a;--goldD:#8a6418;--line:#c9a24a;--felt:#2e86c8;
  --display:Arial,"Helvetica Neue",Helvetica,system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;background:var(--night);color:var(--cream);font-family:var(--body);overflow:hidden;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#stage{position:fixed;inset:0;background:var(--night)}
#cv{display:block;touch-action:none;position:absolute;left:0;top:0;image-rendering:auto}
.px{background:var(--panel);border:2px solid var(--line);border-radius:3px;box-shadow:0 0 0 2px #0b0912,inset 0 0 0 1px rgba(255,236,190,.12),0 6px 0 rgba(0,0,0,.35)}
#rotate{position:fixed;inset:0;z-index:50;background:var(--night);display:grid;place-items:center;padding:24px;text-align:center}
#rotate .rot{display:flex;flex-direction:column;align-items:center;gap:12px;max-width:340px}
#rotate h2{margin:0;font-family:var(--display);font-weight:700;font-size:28px;color:var(--cream)}
#rotate p{margin:0;color:var(--muted);font-size:15px;line-height:1.45}
.btn{appearance:none;border:2px solid var(--line);background:var(--panel);color:var(--cream);font:700 15px var(--display);border-radius:3px;
  box-shadow:0 0 0 2px #0b0912,inset 0 -3px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,236,190,.12);
  min-width:50px;height:46px;padding:0 12px;display:grid;place-items:center;cursor:pointer;touch-action:manipulation}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn:active{background:var(--panel2);box-shadow:0 0 0 2px #0b0912,inset 0 3px 0 rgba(0,0,0,.35)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.act{background:var(--gold);color:#2a1a04;border-color:#fff0b0}
#menu,#pause,#over{position:fixed;inset:0;display:flex;padding:14px;background:rgba(10,8,18,.86);overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;z-index:20}
#menu.titleOn{background:transparent}
#pause{z-index:30} #over{z-index:25;background:rgba(10,8,18,.35);align-items:flex-end;justify-content:center;pointer-events:none}
#over .card{pointer-events:auto;margin:0 0 10px;width:min(520px,100%);padding:12px 16px}
.card{width:min(460px,100%);margin:auto;padding:16px 18px 14px;display:flex;flex-direction:column;gap:10px}
.card.wide{width:min(720px,100%);max-height:calc(100vh - 28px)}
.head{display:flex;align-items:center;gap:12px}.head .btn{height:38px;min-width:0;padding:0 12px;font-size:14px}
.fbody{display:flex;flex-direction:column;gap:8px;flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.card h1{margin:0;font-family:var(--display);font-weight:700;font-size:44px;line-height:.95;color:var(--gold);text-shadow:0 3px 0 #5a3a08;letter-spacing:.02em}
.card h2{margin:0;font-family:var(--display);font-weight:700;font-size:24px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}
.card p b{color:var(--cream)}
.opts{display:flex;flex-direction:column;gap:8px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{appearance:none;text-align:left;border:2px solid #4a4266;background:rgba(246,239,224,.05);color:var(--cream);border-radius:3px;
  padding:9px 13px;cursor:pointer;font:700 17px var(--display);display:flex;flex-direction:column;gap:2px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3);touch-action:manipulation}
.opt small{font:400 13px var(--body);color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt.primary{background:var(--gold);color:#2a1a04;border-color:#fff0b0;box-shadow:inset 0 -4px 0 var(--goldD)}
.opt.primary small{color:#5a4210}
.opt.sel{border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,184,74,.35),inset 0 -3px 0 rgba(0,0,0,.3)}
.opt[disabled]{opacity:.45;cursor:default}
.tog{display:flex;gap:8px}.tog .opt{flex:1;align-items:center;text-align:center}
.note{font-size:13px;color:var(--muted)} .warn{color:#f3a37f}
.back{align-self:flex-start}
.inrow{display:flex;gap:8px}
.inrow input,.fld input{flex:1;min-width:0;height:46px;border-radius:3px;border:2px solid #4a4266;background:rgba(246,239,224,.06);color:var(--cream);
  font:700 22px var(--display);letter-spacing:.1em;text-align:center;-webkit-user-select:text;user-select:text}
.inrow input:focus-visible{outline:2px solid var(--gold)}
.frSec{display:flex;flex-direction:column;gap:6px}
.frSec h3{margin:6px 0 0;font:700 15px var(--display);color:var(--gold)}
.frRow{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 12px;border:2px solid #4a4266;border-radius:3px;background:rgba(246,239,224,.05)}
.frRow.hot{border-color:var(--gold)}
.frRow .t{flex:1;min-width:0;font:600 15px var(--display);color:var(--cream);overflow-wrap:anywhere}
.frRow .t small{display:block;font:400 13px var(--body);color:var(--muted)}
.frRow .btn{height:38px;min-width:0;padding:0 12px;font-size:14px;flex:none}
.vrow{display:flex;flex-direction:column;gap:6px}
.vhead{display:flex;justify-content:space-between;align-items:baseline;font:700 15px var(--display);color:var(--cream)}
.vhead output{color:var(--gold);min-width:3.2em;text-align:right}
.vctl{display:flex;align-items:center;gap:10px}
.vstep{appearance:none;flex:0 0 auto;width:44px;height:44px;border:2px solid #4a4266;background:rgba(246,239,224,.05);color:var(--cream);border-radius:3px;font:700 22px var(--display);cursor:pointer;touch-action:manipulation}
.vctl input[type=range]{flex:1 1 auto;min-width:0;height:44px;margin:0;background:transparent;accent-color:var(--gold);touch-action:pan-y}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);padding:6px 14px;font-family:var(--display);font-weight:600;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:min(92vw,560px);text-align:center;z-index:40}
#toast.show{opacity:1}
#chat{position:fixed;left:50%;transform:translateX(-50%);top:10px;width:min(62vw,380px);display:flex;flex-direction:column;gap:5px;padding:6px;z-index:28}
#chatLog{flex:1;min-height:70px;max-height:104px;overflow-y:auto;font-size:13px;line-height:1.3;-webkit-overflow-scrolling:touch}
#chatLog .cm{margin:2px 0;word-break:break-word} #chatLog .me b{color:var(--gold)} #chatLog .fr b{color:#8fd0ff}
#chatQ{display:flex;flex-wrap:wrap;gap:3px}
#chatQ button{font:600 12px var(--body);white-space:nowrap;flex:1 1 auto;padding:3px 5px;min-height:26px;border-radius:3px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--cream)}
#chatRow{display:flex;gap:4px} #chatIn{flex:1;min-width:0;font-size:14px;padding:4px 6px;border-radius:3px;border:1px solid var(--line);background:#0b0912;color:var(--cream);-webkit-user-select:text;user-select:text}
#chatRow .btn{height:32px;min-width:34px;padding:0 8px;font-size:13px}
#chatPop{position:fixed;left:50%;transform:translateX(-50%);top:30px;max-width:min(60vw,360px);padding:5px 10px;font-size:13px;z-index:27;cursor:pointer;word-break:break-word}
#replayTag{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;padding:3px 10px;font:600 12px var(--display);color:var(--muted);z-index:6;pointer-events:none}
/* ---- in-game HUD: real DOM on top of the canvas, sized in table units (--u = CSS px per unit, set from the layout) so it scales with the table. Top row: the menu button, two player bars, their framed pictures and a centre box. Under it, the ball track with its curved end dropping to the table. All colours come from variables the themes override. ---- */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none;font-family:var(--display);--u:1.3px;
  --pcb:#6a5a2a;--pcg1:rgba(44,38,66,.95);--pcg2:rgba(14,12,24,.95);--pcsh:rgba(0,0,0,0);--nm:#b9b0d0;--nmon:#ffd45a;--grp:#a89ec4;--on:#ffd45a;--onrgb:255,205,80;--txt:#f6efe0;
  --avf1:#f6dc92;--avf2:#8a6418;--avon1:#fff3b0;--avon2:#e8a81c;--avbg1:#4a4470;--avbg2:#14121f;
  --box1:#2c2750;--box2:#100e1c;--boxb:#c8a24a;
  --ham1:#62e066;--ham2:#1d9a2c;--hamb:#0d5416;
  --rail:#aeb4bd;--tfill:#0b0d12;--tglow:rgba(0,0,0,0)}
#hud[hidden]{display:none}
.pc{position:absolute;display:flex;align-items:center;box-sizing:border-box;color:var(--txt);border-radius:calc(var(--u)*13);
  padding:0 calc(var(--u)*24) 0 calc(var(--u)*10);
  background:linear-gradient(180deg,var(--pcg1),var(--pcg2));border:calc(var(--u)*1) solid var(--pcb);
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,236,190,.14),0 0 calc(var(--u)*6) var(--pcsh);transition:box-shadow .25s,border-color .25s}
.pc.r{flex-direction:row-reverse;padding:0 calc(var(--u)*10) 0 calc(var(--u)*24);text-align:right}
.pc.on{border-color:var(--on);box-shadow:0 0 calc(var(--u)*9) rgba(var(--onrgb),.5),0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.55),inset 0 1px 0 rgba(255,236,190,.2)}
.pc.won{border-color:#7dff8a;box-shadow:0 0 calc(var(--u)*9) rgba(125,255,138,.6)}
.pc .info{display:flex;flex-direction:column;justify-content:center;gap:calc(var(--u)*1.8);min-width:0}
.pc .nmRow{display:flex;align-items:baseline;gap:calc(var(--u)*5);white-space:nowrap}
.pc.r .nmRow{flex-direction:row-reverse}
.pc .nm{font-size:calc(var(--u)*10.5);font-weight:800;color:var(--nm);letter-spacing:.01em;line-height:1.1}
.pc.on .nm{color:var(--nmon)}.pc.won .nm{color:#7dff8a}
.pc .grp{font-size:max(8px,calc(var(--u)*6.8));font-weight:700;color:var(--grp);text-transform:uppercase;letter-spacing:.08em;line-height:1.1}
.pc .balls{display:flex;gap:calc(var(--u)*1.5);height:calc(var(--u)*11)}
.pc.r .balls{justify-content:flex-end}
.pc .balls img,.pc .balls i{display:block;width:calc(var(--u)*11);height:calc(var(--u)*11);flex:none;image-rendering:auto}
.pc .balls i{border-radius:50%;border:1px dashed rgba(255,255,255,.3);box-sizing:border-box}
.pc .balls img.gone{opacity:.2;filter:grayscale(.75)}
.pc .balls img.eight{filter:drop-shadow(0 0 calc(var(--u)*3) rgba(255,230,120,.95));animation:eightPulse 1.2s ease-in-out infinite}
@keyframes eightPulse{50%{transform:scale(1.2)}}
/* the framed profile pictures, like the reference's square portraits */
.avf{position:absolute;box-sizing:border-box;border-radius:calc(var(--u)*7);padding:calc(var(--u)*1.7);background:linear-gradient(135deg,var(--avf1),var(--avf2));
  box-shadow:0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35);transition:box-shadow .25s}
.avf .avi{display:block;width:100%;height:100%;box-sizing:border-box;padding:calc(var(--u)*1.2);border-radius:calc(var(--u)*5.3);background:radial-gradient(circle at 50% 38%,var(--avbg1),var(--avbg2) 85%)}
.avf.on{background:linear-gradient(135deg,var(--avon1),var(--avon2));box-shadow:0 0 calc(var(--u)*10) rgba(var(--onrgb),.85),0 calc(var(--u)*2) calc(var(--u)*5) rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.5)}
.avf.won{background:linear-gradient(135deg,#d8ffd8,#2fbf4a);box-shadow:0 0 calc(var(--u)*10) rgba(125,255,138,.8)}
/* the centre box: what's going on (or the 8 when nothing needs saying) */
#hudStatus{position:absolute;display:flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0 calc(var(--u)*4);text-align:center;border-radius:calc(var(--u)*7);
  background:linear-gradient(180deg,var(--box1),var(--box2));border:calc(var(--u)*1.5) solid var(--boxb);color:var(--txt);

<script>
(function(){"use strict";
/* ===== core.js ===== */
/* =====================================================================
   PIXEL 8-BALL: shared constants, tiny helpers, the seeded random generator,
   and the table geometry. Nothing in here touches the page, so the same
   code runs in the tests under Node.
   The shot simulation (physics.js) is deterministic: only + - * / and sqrt,
   no trig and no Math.random, so two phones that start from the same table
   and the same shot see exactly the same result. Pictures and sounds may
   use anything.
   ===================================================================== */
const EB_VER=11;                                   /* shown as 1.1 (see verName); whole numbers so versions can be compared — bumped for v42 (called-shot rule + acceptor breaks) so the lver gate keeps replays on matching versions */
const verName=n=>(n/10).toFixed(1);
const SRV_BAKED="https://spellsiege.spellsiege-kh.workers.dev";   /* the same game server Spellsiege uses */
const POOL_WORLD=100;                              /* the server's "world" number that marks a pool game */

/* table: units are internal pixels, the playing surface runs from cushion face to cushion face */
const TW=392, TH=196, BR=8, RAILW=22;              /* length, width, ball radius, visible rail thickness (was 18; 22 is about 20% thicker, per his ask) */
const HEAD_X=Math.round(TW*0.25), FOOT_X=Math.round(TW*0.75), MID_Y=TH/2;
const GC=15, GS=12;                                /* corner gap and side half-gap in the cushions */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const sqr=v=>v*v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const q2=v=>Math.round(v*100)/100;                 /* positions are kept to 0.01 so both phones hold identical numbers */
/* ball numbers: 0 cue, 1-7 solids, 8 black, 9-15 stripes */
const groupOf=n=>n===0?-2:n===8?-1:n<8?0:1;      /* 0 solids, 1 stripes, -1 the 8, -2 the cue ball */
const GROUP_NAME=["Solids","Stripes"];
const BALL_COL=["#f4f0e4","#f2c230","#2f5fd0","#e03a2e","#6a2fa8","#f08a24","#2f9a4a","#8a2a2a","#16161c"];  /* index = number, 9-15 reuse 1-7 */
/* neon theme: the same indexing, but every colour is a lit-up neon (cue
   stays cream, the 8 stays near-black so it still reads as the 8) */
const NEON_BALL_COL=["#f4f0e4","#ffe600","#00d5ff","#ff2a4d","#c04dff","#ff8a00","#00ff9d","#ff2e7e","#0a0a12"];

/* ===== physics.js ===== */
/* =====================================================================
   SHOT PHYSICS. One class, Sim, steps the table at a fixed 240 Hz.
   Balls are discs (radius BR): rolling friction, ball-ball collisions,
   cushions made of straight pieces with jaw tips at the pockets, and six
   pockets. The cue ball can carry top/back spin (follow and draw after it
   hits a ball) and side spin (English on the cushions).
   Deterministic: only + - * / and sqrt.
   ===================================================================== */
const STEP=1/240, VMAX=1248, FRIC_A=41.6, FRIC_K=0.24, E_BALL=0.96, E_CUSH=0.76, SIDE_K=0.30, TOP_K=0.50, TOP_DECAY=0.999, MAX_STEPS=240*28;
const SEGS=[   /* x1,y1,x2,y2 and the normal that points onto the table */
  [GC,0,TW/2-GS,0,0,1],[TW/2+GS,0,TW-GC,0,0,1],
  [GC,TH,TW/2-GS,TH,0,-1],[TW/2+GS,TH,TW-GC,TH,0,-1],
  [0,GC,0,TH-GC,1,0],[TW,GC,TW,TH-GC,-1,0]];
const POCKET_XY=[[-7.8,-7.8],[TW+7.8,-7.8],[-7.8,TH+7.8],[TW+7.8,TH+7.8],[TW/2,-10],[TW/2,TH+10]];   /* where a ball drops out of sight — the pocket centres, flush with the felt */
/* which pocket a ball centre is in, or -1 */
function pocketAt(x,y){

/* =====================================================================

   phone, and judge(), which turns a finished shot into the next state.
   Standard 8-ball: solids and stripes, the table is open until someone
   legally pockets a ball — including on the break: the first ball in
   picks the group for the shooter. Fouls give the other player the
   cue ball anywhere, and the 8 wins or loses the game.

     v:1  seed  n (shots so far)  turn (0 or 1: who shoots next)
     groups:[g0,g1]  -1 open, 0 solids, 1 stripes

/* ---- table building blocks shared by every theme ---- */
const CCOFF=7.8;   /* corner-hole centre offset from the felt corner (11/sqrt(2)) */
const POCKET_R=[11,11,11,11,10,10];
/* pocket centres and radii in table-sprite units (felt origin at RAILW,RAILW) */
function pocketList(){
  const ox=RAILW,oy=RAILW;
  return [[ox-CCOFF,oy-CCOFF,11],[ox+TW+CCOFF,oy-CCOFF,11],[ox-CCOFF,oy+TH+CCOFF,11],[ox+TW+CCOFF,oy+TH+CCOFF,11],[ox+TW/2,oy-10,10],[ox+TW/2,oy+TH+10,10]];
}
/* the mitered rail frame: four quads, each with a gradient across its thickness */
function drawFrame(g,stops){
  const W=TBL_W,H=TBL_H,t=RAILW;
  const sides=[
    {p:[0,0,W,0,W-t,t,t,t],g:[0,0,0,t]},
    {p:[0,H,W,H,W-t,H-t,t,H-t],g:[0,H,0,H-t]},
    {p:[0,0,t,t,t,H-t,0,H],g:[0,0,t,0]},
    {p:[W,0,W-t,t,W-t,H-t,W,H],g:[W,0,W-t,0]},
  ];
  for(const s of sides){
    const gr=g.createLinearGradient(s.g[0],s.g[1],s.g[2],s.g[3]);
    for(const [o,c] of stops) gr.addColorStop(o,c);
    avPath(g,s.p); g.fillStyle=gr; g.fill();
  }
  g.strokeStyle="rgba(0,0,0,0.30)"; g.lineWidth=0.6; g.beginPath();
  g.moveTo(0,0);g.lineTo(t,t);g.moveTo(W,0);g.lineTo(W-t,t);g.moveTo(0,H);g.lineTo(t,H-t);g.moveTo(W,H);g.lineTo(W-t,H-t);g.stroke();
}
/* a rounded outer edge: light catches the top-left, the bottom-right falls away */
function outerBevel(g,glow){
  const W=TBL_W,H=TBL_H;
  rrect(g,0.6,0.6,W-1.2,H-1.2,5); g.lineWidth=1.2;
  const gr=g.createLinearGradient(0,0,W,H); gr.addColorStop(0,"rgba(255,255,255,0.34)"); gr.addColorStop(0.45,"rgba(255,255,255,0.02)"); gr.addColorStop(0.55,"rgba(0,0,0,0.05)"); gr.addColorStop(1,"rgba(0,0,0,0.6)");
  g.strokeStyle=gr; g.stroke();
  rrect(g,1.9,1.9,W-3.8,H-3.8,4); g.lineWidth=0.6; g.strokeStyle=glow||"rgba(255,255,255,0.10)"; g.stroke();
}
/* clip to the part of the table that is NOT felt (rails and pockets) */
function railClip(g){const ox=RAILW,oy=RAILW;g.beginPath();g.rect(0,0,TBL_W,TBL_H);g.rect(ox-5,oy-5,TW+10,TH+10);g.clip("evenodd");}
function feltPath(g){
  const ox=RAILW,oy=RAILW,C=CCOFF;
  g.beginPath(); g.rect(ox,oy,TW,TH);
  /* the four corner tongues, each wound the same way as the rectangle so the fill is a union (opposite windings would punch holes) */
  const tri=(ax,ay,bx,by,cx,cy)=>{
    if((bx-ax)*(cy-ay)-(by-ay)*(cx-ax)<0){const tx=bx,ty=by;bx=cx;by=cy;cx=tx;cy=ty;}
    g.moveTo(ax,ay); g.lineTo(bx,by); g.lineTo(cx,cy); g.closePath();
  };
  tri(ox+GC,oy, ox,oy+GC, ox-C,oy-C);
  tri(ox+TW-GC,oy, ox+TW,oy+GC, ox+TW+C,oy-C);
  tri(ox+GC,oy+TH, ox,oy+TH-GC, ox-C,oy+TH+C);
  tri(ox+TW-GC,oy+TH, ox+TW,oy+TH-GC, ox+TW+C,oy+TH+C);
}
/* the cushion trapezoids (one per rail piece, wider at the rail, narrow at the felt) */
function cushionGeo(){
  const ox=RAILW,oy=RAILW,th=5,out=[];
  for(const [x0,y0,x1,y1,nx,ny] of SEGS){
    let pts,gx0,gy0,gx1,gy1;
    if(ny!==0){const yF=ny>0?oy:oy+TH,yR=ny>0?oy-th:oy+TH+th;pts=[[ox+x0,yF],[ox+x1,yF],[ox+x1+(th-1),yR],[ox+x0-(th-1),yR]];gx0=0;gy0=yF;gx1=0;gy1=yR;}
    else{const xF=nx>0?ox:ox+TW,xR=nx>0?ox-th:ox+TW+th;pts=[[xF,oy+y0],[xF,oy+y1],[xR,oy+y1+(th-1)],[xR,oy+y0-(th-1)]];gx0=xF;gy0=0;gx1=xR;gy1=0;}
    out.push({pts,gx0,gy0,gx1,gy1,nx,ny});
  }
  return out;
}
/* a soft shadow where the cushions meet the felt: the raised walls shade it */
function cushionShadow(g,amt){
  const ox=RAILW,oy=RAILW; g.save(); g.beginPath(); g.rect(ox,oy,TW,TH); g.clip();
  const es=(x0,y0,x1,y1)=>{const gr=g.createLinearGradient(x0,y0,x1,y1);gr.addColorStop(0,"rgba(0,0,0,"+amt+")");gr.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=gr;g.fillRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0)||TW,Math.abs(y1-y0)||TH);};
  es(ox,oy,ox,oy+6); es(ox,oy+TH,ox,oy+TH-6); es(ox,oy,ox+6,oy); es(ox+TW,oy,ox+TW-6,oy);
  g.restore();
}
/* generic cushion: felt-coloured, nose lit, shadowed towards the rail */
function drawCushions(g,c0,c1,c2,noseA,jawCol){
  for(const cg of cushionGeo()){
    const gr=g.createLinearGradient(cg.gx0,cg.gy0,cg.gx1,cg.gy1);
    gr.addColorStop(0,c0); gr.addColorStop(0.18,c1); gr.addColorStop(1,c2);
    avPath(g,[].concat(...cg.pts)); g.fillStyle=gr; g.fill();

  }
}
/* leather-lipped pocket: a deep cup set into the rail */
function pocketLeather(g,x,y,r,lipA,lipB,glow){

  const sg=g.createRadialGradient(x,y,r,x,y,r+9); sg.addColorStop(0,"rgba(0,0,0,0.6)"); sg.addColorStop(1,"rgba(0,0,0,0)"); g.fillStyle=sg; circ(g,x,y,r+9); g.fill();

function eachSight(fn){

/* ===================== ANCIENT RUINS — white Greek marble ===================== */
/* marble: soft mottling plus long, branching grey veins */
function veinPts(rng,x,y,ang,len,steps){
  const pts=[[x,y]]; let cx=x,cy=y,a=ang;
  for(let i=0;i<steps;i++){a+=(rng()-0.5)*0.9;cx+=Math.cos(a)*len/steps;cy+=Math.sin(a)*len/steps;pts.push([cx,cy]);}
  return pts;
}
function strokePts(g,pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.stroke();}
function marbleVeins(g,rng,x,y,w,h,n,col,aMax,sc){
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip(); g.lineCap="round"; g.lineJoin="round";
  for(let i=0;i<n;i++){
    const sx=x+rng()*w, sy=y+rng()*h, ang=rng()*6.283, len=(40+rng()*120)*sc, st=Math.max(6,(len/6)|0);
    const pts=veinPts(rng,sx,sy,ang,len,st), lw=(0.25+rng()*0.7)*sc, al=aMax*(0.35+rng()*0.65);
    g.strokeStyle=rgba(col,al*0.26); g.lineWidth=lw*5; strokePts(g,pts);
    g.strokeStyle=rgba(col,al); g.lineWidth=lw; strokePts(g,pts);
    if(rng()<0.6){const b=pts[(pts.length*(0.25+rng()*0.5))|0], p2=veinPts(rng,b[0],b[1],ang+(rng()<0.5?1:-1)*(0.5+rng()*0.7),len*(0.3+rng()*0.4),Math.max(4,st>>1));
      g.strokeStyle=rgba(col,al*0.7); g.lineWidth=lw*0.6; strokePts(g,p2);}
  }
  g.restore();
}
function marbleTone(g,x,y,w,h,cloud,mul){
  stampTile(g,noiseTile("cloud",256,3,3,4,19,v=>(v-0.5)*1.5+0.5),x,y,w,h,190,"soft-light",cloud);

  const run=(dx,dy,c,w)=>{g.save();g.translate(dx,dy);g.strokeStyle=c;g.lineWidth=w;
    g.beginPath();g.moveTo(0,3);g.lineTo(len,3);g.stroke();
    for(let x=0;x+8<=len;x+=8){g.beginPath();g.moveTo(x,3);g.lineTo(x,-3);g.lineTo(x+6,-3);g.lineTo(x+6,1);g.lineTo(x+2,1);g.lineTo(x+2,-1);g.lineTo(x+4,-1);g.stroke();}

}

/* ===== audio.js ===== */
/* =====================================================================
   SOUND: everything is synthesized (no sound files). Ball clicks, cushion
   thumps, pocket drops, a cue strike, a soft felt rolling rumble, little
   chimes and an optional synthwave loop. Volumes come from the settings
   (saved on the phone).
   Real pool balls are phenolic resin — the click is a very short, sharp
   "tock": a broadband crack with a fast-decaying resonance around
   2–4 kHz, not a sustained tone. So the impact sounds are built from
   short band-passed noise bursts plus a quickly-dying resonant ping,
   with the pitch and loudness following the impact speed and a little
   random variation per hit (no two clicks are ever identical).
   The background music is a synthwave loop (see the bottom of the file).
   ===================================================================== */
const SET={sfx:0.8,music:0.5,...(()=>{try{return JSON.parse(localStorage.getItem("eb-set")||"{}");}catch(e){return {};}})()};
function saveSet(){try{localStorage.setItem("eb-set",JSON.stringify(SET));}catch(e){}}
let AC=null,SFXG=null,MUSG=null,NOISE=null;
function audioInit(){
  if(AC){if(AC.state==="suspended")AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    SFXG=AC.createGain();SFXG.gain.value=SET.sfx;SFXG.connect(AC.destination);
    MUSG=AC.createGain();MUSG.gain.value=SET.music*0.22;MUSG.connect(AC.destination);
    const n=AC.sampleRate*1.5, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1; NOISE=buf;
    if(SET.music>0) musicStart();
  }catch(e){AC=null;}
}
function applyVolumes(){if(!AC)return;SFXG.gain.value=SET.sfx;MUSG.gain.value=SET.music*0.22;if(SET.music>0)musicStart();else musicStop();}
function tn(o){   /* one tone: o={f0,f1,dur,type,vol,delay,a,dest} */
  if(!AC||(!o.dest&&SET.sfx<=0)) return;
  const t=AC.currentTime+(o.delay||0), osc=AC.createOscillator(), g=AC.createGain();
  osc.type=o.type||"sine"; osc.frequency.setValueAtTime(o.f0,t); if(o.f1) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t+o.dur);
  const a=o.a||0.004; g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(o.vol||0.2,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  osc.connect(g); g.connect(o.dest||SFXG); osc.start(t); osc.stop(t+o.dur+0.05);
}
function nz(o){   /* a burst of filtered noise: o={dur,vol,hp,lp,bp,q,delay,rate,a} */
  if(!AC||(!o.dest&&SET.sfx<=0)||!NOISE) return;
  const t=AC.currentTime+(o.delay||0), src=AC.createBufferSource(), g=AC.createGain();
  src.buffer=NOISE; src.playbackRate.value=o.rate||1; let last=src;
  if(o.bp){const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=o.bp;f.Q.value=o.q||1;last.connect(f);last=f;}
  if(o.hp){const f=AC.createBiquadFilter();f.type="highpass";f.frequency.value=o.hp;last.connect(f);last=f;}
  if(o.lp){const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=o.lp;last.connect(f);last=f;}
  const a=o.a||0; g.gain.setValueAtTime(0.0001,t);
  if(a>0) g.gain.linearRampToValueAtTime(o.vol||0.2,t+a); else g.gain.setValueAtTime(o.vol||0.2,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
  last.connect(g); g.connect(o.dest||SFXG); src.start(t,Math.random()*0.5); src.stop(t+o.dur+0.05);
}
/* ---- the felt rolling rumble: a looped, low-passed noise whose level
   follows how fast the balls are moving. Started once, silent until
   SFX.roll() raises it. ---- */
let ROLL=null;
function rollInit(){
  if(!AC||ROLL) return;
  const src=AC.createBufferSource(); src.buffer=NOISE; src.loop=true;
  const filt=AC.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=360; filt.Q.value=0.5;
  const g=AC.createGain(); g.gain.value=0;
  src.connect(filt); filt.connect(g); g.connect(SFXG); src.start();
  ROLL={src,filt,g};
}
const SFX={
  cue(p){
    /* the leather tip on the cue ball: a soft low thump, a short mid
       "thwack", and the quiet click of the ball being struck. */
    tn({f0:95,f1:55,dur:0.09,type:"sine",vol:0.10+0.30*p});
    nz({dur:0.02,vol:0.12+0.25*p,bp:1500,q:0.9});
    nz({dur:0.012,vol:0.08+0.20*p,bp:3000,q:1.1});
    tn({f0:2800,f1:2600,dur:0.03,type:"sine",vol:0.04+0.10*p});
  },
  ball(v){
    const k=Math.min(1,v/380); if(k<0.03)return;
    /* the crack: a very short band-passed noise burst, centred where a
       phenolic ball rings (about 3 kHz), slightly different every hit. */
    const f=2600+Math.random()*900;
    nz({dur:0.014,vol:0.10+0.38*k,bp:f,q:1.1});
    /* the "tock" body: a resonant ping that dies in about 30 ms. */
    tn({f0:f*0.95,f1:f*0.85,dur:0.035,type:"sine",vol:0.05+0.16*k});
    /* a low thock under hard hits only. */
    if(k>0.45) tn({f0:340+Math.random()*80,f1:240,dur:0.028,type:"triangle",vol:0.10*k});
  },
  rail(v){
    const k=Math.min(1,v/300); if(k<0.04)return;
    /* a dull cushion thud: a low sine plus a soft lowpassed "whump". */
    tn({f0:115,f1:58,dur:0.13,type:"sine",vol:0.08+0.22*k});
    nz({dur:0.09,vol:0.05+0.15*k,lp:380,a:0.012});
  },
  pocket(){
    /* the ball hits the pocket: a leather "thock" … */
    nz({dur:0.05,vol:0.22,bp:650,q:0.8});
    tn({f0:175,f1:88,dur:0.11,type:"sine",vol:0.18});
    /* … a brief rattle against the pocket … */
    nz({dur:0.008,vol:0.08,bp:2600,q:1.2,delay:0.05});
    nz({dur:0.008,vol:0.06,bp:2200,q:1.2,delay:0.11});
    /* … then it drops into the return with a deep thunk. */
    tn({f0:108,f1:42,dur:0.32,type:"sine",vol:0.22,delay:0.17});
    nz({dur:0.18,vol:0.10,lp:280,a:0.02,delay:0.17});
  },
  roll(level){
    /* level 0–1: how fast the balls are moving. Silent when 0. The
       rumble gets a touch brighter when the balls are flying. */
    if(!AC) return; rollInit();
    const t=AC.currentTime, lv=Math.max(0,Math.min(1,level||0));
    ROLL.g.gain.setTargetAtTime(lv*0.30,t,0.07);
    ROLL.filt.frequency.setTargetAtTime(300+500*lv,t,0.09);
  },
  click(){nz({dur:0.008,vol:0.10,bp:2400,q:1});tn({f0:1200,f1:900,dur:0.03,type:"sine",vol:0.05});},
  tick(){nz({dur:0.006,vol:0.06,bp:3000,q:1});},
  place(){tn({f0:520,f1:780,dur:0.08,type:"sine",vol:0.10});},
  foul(){tn({f0:196,f1:147,dur:0.22,type:"triangle",vol:0.10});tn({f0:165,f1:123,dur:0.28,type:"triangle",vol:0.10,delay:0.12});},
  turn(){tn({f0:660,dur:0.07,type:"sine",vol:0.06});tn({f0:880,dur:0.10,type:"sine",vol:0.06,delay:0.08});},
  win(){[523,659,784,1047,784,1047,1319].forEach((f,i)=>tn({f0:f,dur:0.18,type:"sine",vol:0.09,delay:i*0.11}));},
  lose(){[392,349,294,262].forEach((f,i)=>tn({f0:f,f1:f*0.97,dur:0.3,type:"sine",vol:0.12,delay:i*0.2}));},
  chat(){tn({f0:988,dur:0.06,type:"sine",vol:0.08});tn({f0:1319,dur:0.1,type:"sine",vol:0.08,delay:0.07});},
};
/* ---- NEON DRIVE: a synthwave loop, scheduled a little ahead of time ----
   A minor, 4/4, 104 BPM. 16 bars x 16 sixteenth-note steps = 256 steps,
   about 37 seconds per loop, seamless (step 255 wraps to step 0).
   Chords (one per bar): Am F C G | Am F Dm E | Am F C G | Am F Dm E.
   Layers: a sustained triangle pad (the chord, whole bar), a driving
   8th-note bass (root, octave up on steps 6 and 14) with a sine sub,
   a 16th-note arpeggio cycling the chord tones two octaves up, a
   four-on-the-floor kick with a backbeat snare and hats, and an
   A-minor-pentatonic lead — bars 1-8 state the motif, bars 9-16 vary
   it, lift with fewer rests, and climb to a high A (81) before
   resolving back down to A (69) into the next loop.
   Everything routes through MUSG (SET.music * 0.22); volumes are modest
   so the mix stays clean. */
const mtof=m=>440*Math.pow(2,(m-69)/12);
const CHORDS={
  Am:{tones:[57,60,64],root:33},
  F:{tones:[53,57,60],root:29},
  C:{tones:[60,64,67],root:36},
  G:{tones:[55,59,62],root:31},
  Dm:{tones:[50,53,57],root:26},
  E:{tones:[52,56,59],root:28},

const PROG=["Am","F","C","G","Am","F","Dm","E","Am","F","C","G","Am","F","Dm","E"];
const ARP=[0,1,2,1,0,1,2,2,0,1,2,1,2,1,0,1];
const MELODY=[
  69,0,72,0,76,0,74,72,
  72,0,69,0,65,0,69,0,
  67,0,72,0,76,0,79,76,
  74,0,71,0,74,0,71,0,
  69,0,72,0,76,0,74,72,
  77,0,76,0,72,0,69,0,
  74,0,77,0,76,0,74,72,
  71,0,76,0,74,0,71,0,
  69,0,72,0,76,0,74,72,
  72,0,69,0,65,0,69,0,
  67,0,72,0,76,0,79,76,
  74,0,71,0,74,0,71,0,
  69,72,76,0,79,76,74,72,
  77,76,72,69,72,76,77,0,
  74,77,79,81,79,76,74,72,
  76,74,71,69,0,0,0,0,

let musT=0,musStep=0,musNext=0;
function musicStart(){if(!AC||musT)return;musNext=AC.currentTime+0.1;musStep=0;musT=setInterval(musicTick,120);}
function musicStop(){clearInterval(musT);musT=0;}
function musicTick(){
  if(!AC||document.visibilityState!=="visible") return;
  /* if we fell behind (tab was hidden), resync instead of scheduling a
     burst of catch-up notes all at once. */
  if(musNext<AC.currentTime-0.1) musNext=AC.currentTime+0.05;
  const step16=60/104/4, barDur=step16*16;   /* a 16th at 104 bpm; one bar */
  while(musNext<AC.currentTime+0.35){
    const step=musStep%256, bar=(step/16)|0, sib=step%16, t=musNext-AC.currentTime;
    const ch=CHORDS[PROG[bar]], tones=ch.tones, root=ch.root;
    if(sib===0){   /* pad: the chord, sustained for the bar */
      for(const tone of tones) tn({f0:mtof(tone),dur:barDur,type:"triangle",vol:0.10,delay:t,dest:MUSG,a:0.4});
      tn({f0:mtof(root+12),dur:barDur,type:"sine",vol:0.05,delay:t,dest:MUSG,a:0.4});
    }
    if(sib%2===0){   /* bass: 8ths, root, octave up on steps 6 and 14 */
      const bn=(sib===6||sib===14)?root+12:root;
      tn({f0:mtof(bn),dur:0.26,type:"triangle",vol:0.22,delay:t,dest:MUSG,a:0.01});
      tn({f0:mtof(root),dur:0.28,type:"sine",vol:0.20,delay:t,dest:MUSG,a:0.01});
    }
    tn({f0:mtof(tones[ARP[sib]]+24),dur:0.13,type:"square",vol:0.05,delay:t,dest:MUSG,a:0.005});   /* arp: 16ths */
    if(sib%4===0) tn({f0:120,f1:40,dur:0.12,type:"sine",vol:0.5,delay:t,dest:MUSG,a:0.004});   /* kick */
    if(sib===4||sib===12){ nz({dur:0.12,vol:0.14,bp:1800,q:0.8,delay:t,dest:MUSG}); tn({f0:190,f1:150,dur:0.09,type:"sine",vol:0.10,delay:t,dest:MUSG}); }   /* snare */
    if(sib===2||sib===6||sib===10) nz({dur:0.03,vol:0.05,hp:8000,delay:t,dest:MUSG});   /* closed hat */
    if(sib===14) nz({dur:0.09,vol:0.07,hp:8000,delay:t,dest:MUSG});   /* open hat */
    if(sib%2===0){ const m=MELODY[bar*8+(sib>>1)]; if(m) tn({f0:mtof(m),dur:0.26,type:"square",vol:0.08,delay:t,dest:MUSG,a:0.01}); }   /* lead */
    musNext+=step16; musStep++;
  }
}

/* =====================================================================
   VIEW: the screen layout and everything that is drawn on the canvas.
   The canvas is drawn straight at the screen's real resolution (no
   blown-up low-res buffer): the floor and the table are pre-rendered once
   per layout and theme, and each frame only blits them and draws the
   moving things (ball sprites, the aim guide, the cue sprite, effects).
   Logical units are the same as ever (the table is 436 x 240 units) — PS is
   how many device pixels one unit covers, and UCSS how many CSS pixels.
   Screen plan, top to bottom: the player bar, the table, the ball return.
   ===================================================================== */
const cv=document.getElementById("cv"), dctx=cv.getContext("2d",{alpha:false});

const TK={T:19,x1:22,yc:50.5,x2:258,R:11,slot:14.9,ball:14.6};

function safeInsets(){

function layout(){

  const rpx=capped?ps/u:dpr;                          /* device pixels per CSS pixel actually used */

  const lm0=si.l/u, rm1=BW-si.r/u, lx=(lm0+OX)/2, rx=(OX+TBL_W+rm1)/2;

    power:{x:lx-11,y:OY+26,w:22,h:150},
    spin:{cx:rx,cy:OY+56,r:16},
    fineL:{x:rx-22,y:OY+100,w:20,h:16},fineR:{x:rx+2,y:OY+100,w:20,h:16},
    menu:{x:rx-20,y:OY+4,w:40,h:15},
    ok:{x:rx-20,y:OY+TBL_H-72,w:40,h:19},

const inRect=(r,x,y)=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;

/* ---- the ball track, painted on the floor layer so the table's rail covers where it goes in: it really comes out from under the table ---- */
const TRK_PAL={
  standard:{rimD:"#4b5058",rim:"#aeb4bd",hi:"#f2f5fa",fill:"#0b0d12",glow:null},
  neon:{rimD:"#005a66",rim:"#00d8e8",hi:"#b8ffff",fill:"#070b1c",glow:"rgba(0,240,255,.55)"},
  ruins:{rimD:"#6a5a30",rim:"#c8aa5c",hi:"#fff0b8",fill:"#26221a",glow:null},
  zen:{rimD:"#3a5018",rim:"#8aa24e",hi:"#dcee9c",fill:"#1a2810",glow:null},

function pipePath(g,d,ext){
  const k=TK, y0=OY-TOPU, cx=OX+k.x2, cy=y0+k.yc, xL=OX+k.x1+k.T/2, R=k.R;
  g.beginPath(); g.moveTo(xL-(ext||0),cy-d); g.lineTo(cx,cy-d); g.arc(cx,cy+R,R+d,-Math.PI/2,0); g.lineTo(cx+R+d,OY+10);

function buildTrackSprite(){
  const k=TK, T=k.T, y0=OY-TOPU, pal=TRK_PAL[THEME_NAME]||TRK_PAL.standard;

  /* soft shadow under the whole pipe */
  g.save(); g.shadowColor="rgba(0,0,0,.5)"; g.shadowBlur=4*PS; g.shadowOffsetY=2.2*PS;
  stroke(T+3.4,"rgba(0,0,0,.9)","round"); g.restore();
  if(pal.glow){g.save();g.shadowColor=pal.glow;g.shadowBlur=7*PS;stroke(T+3,pal.rim,"round");g.restore();}
  stroke(T+3.4,pal.rimD,"round");           /* outer edge */
  stroke(T+2.4,pal.rim,"round");            /* the polished rim */
  stroke(T-0.2,pal.rimD,"round");           /* a dark seam between rim and bore */
  stroke(T-1.2,pal.fill,"round");           /* the bore */
  g.globalAlpha=.55; stroke(T*0.5,"#000","butt"); g.globalAlpha=1;   /* the deep middle of the bore */

  g.globalAlpha=.75; stroke(0.9,pal.hi,"butt",T/2+0.9); g.globalAlpha=1;
  g.globalAlpha=.16; stroke(0.8,"#fff","butt",T*0.30); stroke(0.8,"#fff","butt",-T*0.30); g.globalAlpha=1;

}

/* mini balls for the player bar and the track — the very same lit sphere as on the table, just smaller */
function miniBall(n){ return BALLS[n]; }

/* ---- effects: tiny particles, floating call-outs and pocket ripples ---- */
const FXS=[], CALLS=[], SINKS=[], RIPS=[];

function pocketFx(p){const xy=POCKET_XY[p];RIPS.push({x:xy[0],y:xy[1],t:0,c:sparkCol()});}
function stepFx(dt){
  for(let i=FXS.length-1;i>=0;i--){const f=FXS[i];f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vx*=0.94;f.vy*=0.94;if(f.t>f.life)FXS.splice(i,1);}
  for(let i=CALLS.length-1;i>=0;i--){CALLS[i].t+=dt;if(CALLS[i].t>CALLS[i].life)CALLS.splice(i,1);}
  for(let i=SINKS.length-1;i>=0;i--){SINKS[i].t+=dt;if(SINKS[i].t>0.45)SINKS.splice(i,1);}
  for(let i=RIPS.length-1;i>=0;i--){RIPS[i].t+=dt;if(RIPS[i].t>0.7)RIPS.splice(i,1);}

/* ---- ball positions: while the physics runs (fixed 240 Hz) the picture is
   interpolated between the last two steps, so motion is perfectly smooth at
   any refresh rate instead of stepping in 4-6 unit jumps ---- */
const PRX=new Float64Array(16), PRY=new Float64Array(16), PRV=new Uint8Array(16), RDX=new Float64Array(16), RDY=new Float64Array(16);
let ALPHA=1;

/* ---- ball orientations: one 3x3 rotation matrix per ball (ball space ->
   world space), identity when racked so the numbers face up. A rolling ball
   turns around the horizontal axis at right angles to its travel, at
   |v|/r radians per second — see rollStep in play.js. ---- */
const ORIENT=[];
function resetOrient(){for(let i=0;i<16;i++) ORIENT[i]=[1,0,0,0,1,0,0,0,1];}
resetOrient();
function rotOrient(R,kx,ky,kz,ang){
  const c=Math.cos(ang), s=Math.sin(ang), C=1-c;
  /* Rodrigues rotation matrix for a general unit axis, then R' = K * R */
  const K=[[c+kx*kx*C,kx*ky*C-kz*s,kx*kz*C+ky*s],[ky*kx*C+kz*s,c+ky*ky*C,ky*kz*C-kx*s],[kz*kx*C-ky*s,kz*ky*C+kx*s,c+kz*kz*C]];
  const O=R.slice();
  for(let r=0;r<3;r++)for(let col=0;col<3;col++) R[r*3+col]=K[r][0]*O[col]+K[r][1]*O[3+col]+K[r][2]*O[6+col];
}

/* ---- settling the numbers: after a shot every ball eases back to its rack
   orientation (number up, digits upright) over half a second, so when you
   are aiming every number is readable again. View state only. ---- */
let SETTLE=null;
function cancelSettle(){SETTLE=null;}
function startSettle(){
  const axes=[], angs=[];
  for(let i=0;i<16;i++){
    if(!S||!S.b[i]){axes.push(null);angs.push(0);continue;}
    const R=ORIENT[i];
    /* the single rotation that takes R back to identity is R^T: its
       axis-angle is the shortest path home */
    const M=[R[0],R[3],R[6],R[1],R[4],R[7],R[2],R[5],R[8]];
    const tr=M[0]+M[4]+M[8], th=Math.acos(Math.max(-1,Math.min(1,(tr-1)/2)));
    if(th<0.02){axes.push(null);angs.push(0);continue;}
    const s2=Math.sin(th);
    let ax,ay,az;
    if(s2>1e-6){ax=(M[7]-M[5])/(2*s2);ay=(M[2]-M[6])/(2*s2);az=(M[3]-M[1])/(2*s2);}
    else{ /* 180 degrees: recover the axis from the diagonal */
      const d0=M[0]+1,d1=M[4]+1,d2=M[8]+1;
      if(d0>=d1&&d0>=d2){const x=Math.sqrt(Math.max(0,d0/2))||1;ax=x;ay=M[1]/(2*x);az=M[2]/(2*x);}
      else if(d1>=d2){const y=Math.sqrt(Math.max(0,d1/2))||1;ax=M[1]/(2*y);ay=y;az=M[5]/(2*y);}
      else{const z=Math.sqrt(Math.max(0,d2/2))||1;ax=M[2]/(2*z);ay=M[5]/(2*z);az=z;}
      const l=Math.sqrt(ax*ax+ay*ay+az*az)||1;ax/=l;ay/=l;az/=l;
    }
    axes.push([ax,ay,az]); angs.push(th);
  }
  SETTLE={t:0,dur:0.5,axes,angs};
}
function updateSettle(dt){
  if(!SETTLE) return;
  const prev=SETTLE.t; SETTLE.t=Math.min(SETTLE.dur,SETTLE.t+dt);
  const e0=1-Math.pow(1-prev/SETTLE.dur,3), e1=1-Math.pow(1-SETTLE.t/SETTLE.dur,3), de=e1-e0;
  for(let i=0;i<16;i++){
    const a=SETTLE.axes[i]; if(!a) continue;
    rotOrient(ORIENT[i],a[0],a[1],a[2],SETTLE.angs[i]*de);
  }

/* ---- the raked sand remembers where a ball rolled (Zen theme): a groove
   with a light ridge each side, stamped along the path, fading over a few
   seconds. A transparent layer over the sand, under the balls. ---- */
/* sand trails: a ball rolling over raked sand presses a shallow, smooth trench about its own width. It is built from very faint soft stamps, so it stays subtle: a barely darker floor and, on each side, a thin ridge that is lit or shaded depending on which way the light falls (from the top left), like the grooves in a real photograph of raked sand. */
let TR_SOFT=null, TR_LIT=null, TR_DRK=null; const TRAIL={last:new Array(16).fill(null),acc:0,idle:0};
const TRAIL_L=[-0.6,-0.8];
function buildTrailSprites(){
  TR_SOFT=TR_LIT=TR_DRK=null; if(THEME_NAME!=="zen") return;

/* ---- the aim guide: a dotted line to the first thing the cue ball touches, the ghost ball, and where both balls go ---- */
function rayToRail(x,y,ux,uy){   /* distance along a ray to the nearest cushion, for guide lines that must stop at the rail */
  let tc=1e9;
  if(ux>0) tc=Math.min(tc,(TW-BR-x)/ux); else if(ux<0) tc=Math.min(tc,(BR-x)/ux);
  if(uy>0) tc=Math.min(tc,(TH-BR-y)/uy); else if(uy<0) tc=Math.min(tc,(BR-y)/uy);
  return Math.max(0,tc);
}
/* the first thing a ray from c in direction (ux,uy) touches — another ball
   (skipping skip, usually the ball it just left) or a cushion */
function traceRay(c,ux,uy,skip){
  let best=1e9,hit=-1;
  for(let i=1;i<16;i++){
    if(i===skip) continue;
    const p=S.b[i]; if(!p) continue;
    const fx=p[0]-c[0], fy=p[1]-c[1], pr=fx*ux+fy*uy; if(pr<=0) continue;
    const d2=fx*fx+fy*fy-pr*pr; if(d2>=4*BR*BR) continue;
    const t=pr-Math.sqrt(4*BR*BR-d2); if(t<best){best=t;hit=i;}
  }
  const tc=rayToRail(c[0],c[1],ux,uy);
  if(tc<best){best=tc;hit=-1;}
  return {t:Math.max(0,best),hit};
}
function traceAim(c,ux,uy){ return traceRay(c,ux,uy,-1); }
const GUIDE={

/* ---- the pocketed-ball track (the ball return) ---- */
let TRAY=[], TRAY_NEXT=0;
function resetTray(){TRAY.length=0;PENDING_ROLL.clear();TRAY_NEXT=0;TRAY_KEY="";for(const el of document.querySelectorAll(".rollBall")) el.remove();}
/* when a ball drops into a pocket it comes out at the left end of the track
   and rolls along it until it meets the balls already down, just as a real
   ball return stacks them at its far end. A DOM animation (the track is DOM),
   in CSS pixels. The ball only joins TRAY when its roll finishes, so it never
   appears in the track before it gets there. */
const PENDING_ROLL=new Set();
function rollBallToTray(n,px,py){
  if(replaying||n<1) return;
  const slot=TRAY.length+PENDING_ROLL.size; PENDING_ROLL.add(n);
  const hud=document.getElementById("hud"), clip=document.getElementById("trayClip");
  const img=document.createElement("img"); img.src=miniUrl(n); img.alt=""; img.className="rollBall";
  const now=performance.now(), t0=Math.max(now+450,TRAY_NEXT); TRAY_NEXT=t0+260;
  let ready=false, P=null;
  function done(){ img.remove(); PENDING_ROLL.delete(n); if(!TRAY.includes(n)) TRAY.push(n); syncTray(); }
  function step(ts){
    const t=ts-t0;
    if(t<0){requestAnimationFrame(step);return;}
    if(!ready){
      /* geometry is worked out when the roll really starts: the hud may have been hidden or resized since the ball went down. The ball comes up out of the table's rail, round the bend and along the tube to its place. */
      if(hud.hidden||replaying||!(clip.offsetWidth>0)){ done(); return; }
      const k=TK, U=UCSS, y0=OY-TOPU, d=k.ball*U;
      const cx=OX+k.x2, cy=y0+k.yc, vx=cx+k.R, yS=OY+k.ball/2+1, yA=cy+k.R, R=k.R;
      const slotX=OX+k.x1+k.T/2+slot*k.slot;
      const Lv=yS-yA, La=Math.PI/2*R, Lh=Math.max(0,cx-slotX);
      const cl=OX+8, ct=y0+k.yc-k.T/2-4;
      P={Lv,La,Lh,L:Lv+La+Lh,cx,cy,vx,yA,R,slotX,cl,ct,d,U,yS};
      img.style.cssText="position:absolute;left:0;top:0;width:"+d+"px;height:"+d+"px;margin:"+(-d/2)+"px 0 0 "+(-d/2)+"px;pointer-events:none;will-change:transform;";
      clip.appendChild(img); P.dur=Math.max(700,P.L/(200)*1000); ready=true;
    }
    const kk=Math.min(1,t/P.dur), e=1-(1-kk)*(1-kk), s=P.L*e;
    let x,y;
    if(s<P.Lv){x=P.vx;y=P.yS-s;}
    else if(s<P.Lv+P.La){const a=-(s-P.Lv)/P.R;x=P.cx+P.R*Math.cos(a);y=P.yA+P.R*Math.sin(a);}   /* round the bend: from the right going up to the top */
    else {x=P.cx-(s-P.Lv-P.La);y=P.cy;}
    img.style.transform="translate3d("+((x-P.cl)*P.U)+"px,"+((y-P.ct)*P.U)+"px,0) rotate("+(-s/(P.d/P.U/2))+"rad)";
    if(kk<1) requestAnimationFrame(step); else done();
  }
  requestAnimationFrame(step);
}

/* ===== cpu.js ===== */
/* =====================================================================
   THE COMPUTER PLAYER. It lines up every ball against every pocket,
   plays each good-looking shot through the real physics (the same code
   the game uses), judges the result with the real rules, and picks the
   best one. Easier levels look at fewer shots, pick from a wider spread
   and aim with a shakier hand.
   ===================================================================== */
const CPU_LEVELS=[
  {name:"EASY",   noise:0.040, pwrN:0.16, samples:7,  pick:4},
  {name:"MEDIUM", noise:0.015, pwrN:0.07, samples:22, pick:2},
  {name:"HARD",   noise:0.003, pwrN:0.02, samples:70, pick:1},
];
const POCKET_AIM=[[5,5],[TW-5,5],[5,TH-5],[TW-5,TH-5],[TW/2,2],[TW/2,TH-2]];
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/0.75;
function segClear(ax,ay,bx,by,S0,skip,rad){
  const dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1e-6;
  for(let i=1;i<16;i++){
    if(skip.includes(i)) continue; const p=S0.b[i]; if(!p) continue;
    let t=((p[0]-ax)*dx+(p[1]-ay)*dy)/L2; t=t<0?0:t>1?1:t;
    const qx=ax+dx*t-p[0],qy=ay+dy*t-p[1]; if(qx*qx+qy*qy<rad*rad) return false;
  }
  return true;
}
/* every sensible straight-in shot from the cue ball position c */
function genCandidates(S0,c,who){
  const out=[], T=legalTargets(S0,who);
  for(const t of T){
    const b=S0.b[t];
    for(let pk=0;pk<6;pk++){
      const pxy=POCKET_AIM[pk], dx=pxy[0]-b[0], dy=pxy[1]-b[1], dl=Math.sqrt(dx*dx+dy*dy)||1, dX=dx/dl, dY=dy/dl;
      const gx=b[0]-dX*2*BR, gy=b[1]-dY*2*BR;
      if(gx<BR||gx>TW-BR||gy<BR||gy>TH-BR) continue;
      const ux0=gx-c[0], uy0=gy-c[1], ul=Math.sqrt(ux0*ux0+uy0*uy0); if(ul<2) continue;
      const ux=ux0/ul, uy=uy0/ul, cosCut=ux*dX+uy*dY; if(cosCut<0.28) continue;
      if(!segClear(c[0],c[1],gx,gy,S0,[t],2*BR-0.6)) continue;
      if(!segClear(b[0],b[1],pxy[0],pxy[1],S0,[t],2*BR-1.2)) continue;
      const D=ul+dl, bias=cosCut*30-D*0.04;
      for(const dp of [0,0.13,0.3]) out.push({ux,uy,p:clamp(0.14+D/560+dp,0.1,1),bias,ball:t});
    }
  }
  out.sort((a,b)=>b.bias-a.bias);
  return out;
}
/* aim straight at a legal ball: always a legal first contact if the way is clear */
function directShots(S0,c,who){
  const out=[];
  for(const t of legalTargets(S0,who)){
    const b=S0.b[t], dx=b[0]-c[0], dy=b[1]-c[1], l=Math.sqrt(dx*dx+dy*dy)||1;
    for(const p of [0.35,0.6]) out.push({ux:dx/l,uy:dy/l,p,bias:-40-l*0.05,ball:t});
  }
  return out;
}
function b16With(S0,c){const b=S0.b.map(p=>p?p.slice():0);b[0]=c.slice();return b;}
function scoreResult(S0,J,who){
  const S1=J.S; let sc=0;
  if(S1.win===who) return 10000; if(S1.win!==-2) return -10000;
  if(J.foul) sc-=260;
  const myG=S1.groups[who];
  for(const n of J.pottedNow){
    if(n===0||n===8) continue;
    const mine=myG>=0?groupOf(n)===myG:true;
    if(mine) sc+=(J.foul?15:100); else sc-=(J.foul?0:45);
  }
  if(J.continues) sc+=55;
  /* leave the cue ball away from the rails when the turn goes on */
  const c=S1.b[0]; if(c&&J.continues){const e=Math.min(c[0],TW-c[0],c[1],TH-c[1]);sc+=Math.min(e,30)*0.3;}
  /* do not leave the opponent a free table: count their balls left clear of the pockets is too slow; keep it simple */
  return sc;
}
function cpuBreak(S0,L){
  const y=MID_Y+(L.pick>2?(Math.random()-0.5)*40:(Math.random()-0.5)*14), x=HEAD_X*(L.pick>2?0.6:0.9);
  const c=[q2(x),q2(y)], dx=FOOT_X-c[0], dy=MID_Y+(Math.random()-0.5)*2-c[1], l=Math.sqrt(dx*dx+dy*dy);
  const p=L.pick>2?0.82:L.pick===2?0.9:0.97;
  return unpackShot(packShot({ux:dx/l,uy:dy/l,p,sx:0,sy:0,h:S0.hand>0?c:null}));
}
function cpuPlan(S0,level){
  const L=CPU_LEVELS[level|0]||CPU_LEVELS[1], who=S0.turn, hand=S0.hand>0;
  if(S0.brk) return cpuBreak(S0,L);
  /* where the cue ball starts */
  let spots=[S0.b[0].slice()];
  if(hand){
    const pool=[], maxX=S0.hand===1?HEAD_X:TW-BR;
    for(let i=0;i<46;i++){const x=q2(BR+2+Math.random()*(maxX-BR-2)),y=q2(BR+2+Math.random()*(TH-2*BR-4));if(cueSpotOK(S0,x,y)) pool.push([x,y]);}
    if(!pool.length) pool.push(placeDefaultFor(S0));
    const scored=pool.map(p=>{const cs=genCandidates(S0,p,who);return {p,s:cs.length?cs[0].bias+cs.length*1.5:-99};}).sort((a,b)=>b.s-a.s);
    spots=scored.slice(0,L.pick>2?1:L.pick===2?3:6).map(o=>o.p);
    if(L.pick>=4) spots=[scored[Math.floor(Math.random()*scored.length)].p];
    if(L.pick===1) spots=scored.slice(0,3).map(o=>o.p);
  }
  const results=[];
  for(const c of spots){
    let cands=genCandidates(S0,c,who);
    const dir=directShots(S0,c,who);
    const pool=cands.slice(0,L.samples).concat(dir.slice(0,Math.max(3,L.samples>>2)));
    for(const k of pool){
      const shot={ux:k.ux,uy:k.uy,p:k.p,sx:0,sy:0};
      const res=simulateShot(b16With(S0,c),shot), J=judge(S0,res);
      results.push({sc:scoreResult(S0,J,who)+(k.bias||0)*0.2,shot,c});
    }
  }
  results.sort((a,b)=>b.sc-a.sc);
  if(!results.length){   /* nothing found: tap the nearest legal ball */
    const T=legalTargets(S0,who), c=spots[0]; const b=T.length?S0.b[T[0]]:[FOOT_X,MID_Y];
    const dx=b[0]-c[0],dy=b[1]-c[1],l=Math.sqrt(dx*dx+dy*dy)||1;
    return unpackShot(packShot({ux:dx/l,uy:dy/l,p:0.4,sx:0,sy:0,h:hand?c:null}));
  }
  const pickN=Math.min(L.pick,results.length), r=results[Math.floor(Math.random()*pickN)];
  const a=Math.atan2(r.shot.uy,r.shot.ux)+gauss()*L.noise, p=clamp(r.shot.p*(1+gauss()*L.pwrN),0.08,1);
  return unpackShot(packShot({ux:Math.cos(a),uy:Math.sin(a),p,sx:0,sy:0,h:hand?r.c:null}));
}
function placeDefaultFor(S0){
  const c=S0.b[0].slice(); if(cueSpotOK(S0,c[0],c[1])) return c;
  for(let r=0;r<80;r+=2) for(let k=0;k<12;k++){const a=k*0.5236,x=q2(c[0]+Math.cos(a)*r),y=q2(c[1]+Math.sin(a)*r);if(cueSpotOK(S0,x,y)) return [x,y];}
  return c;
}

/* ===== net.js ===== */
/* =====================================================================
   ONLINE: friends, challenges and turn-by-turn games through the same
   game server Spellsiege uses. Pool games have their own player profile
   (own friend code) so they never show up in Spellsiege's lists.
   A "turn" is everything one player does before the turn passes: the
   shots go to the server as a short list; the other phone replays them
   from the start position, then snaps to the saved table.
   ===================================================================== */
const NET={srv:null,prof:null,me:null,err:"",subOK:false,pollT:0,gpT:0,busy:false};
let G=null, visit=null, flushing=false;
const LSJ=(k,v)=>{try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}return null;};
NET.prof=LSJ("eb-profile");
function normSrv(t){
  t=String(t||"").trim(); if(!t) return null;
  if(!/^https?:\/\//i.test(t)) t="https://"+t;
  try{const u=new URL(t);if(u.protocol!=="https:"&&!/^(localhost|127\.0\.0\.1)$/.test(u.hostname))return null;return u.origin;}catch(e){return null;}
}
function srvBase(){
  if(NET.srv) return NET.srv;
  let q=null; try{q=new URLSearchParams(location.search).get("srv");}catch(e){}
  const o=normSrv(q)||normSrv(LSJ("eb-server"));
  NET.srv=o||SRV_BAKED||null; return NET.srv;
}
async function api(action,data,noAuth){
  const base=srvBase(); if(!base){const e=new Error("The game server isn't set up yet.");e.nosrv=true;throw e;}
  const body=Object.assign({},data||{}); if(!noAuth&&NET.prof){body.pid=NET.prof.pid;body.secret=NET.prof.secret;}
  let r;
  try{r=await fetch(base+"/api/"+action,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(body)});}
  catch(e){const er=new Error("Can't reach the game server. Check your internet connection.");er.net=true;throw er;}
  let j={}; try{j=await r.json();}catch(e){}
  if(!r.ok){const er=new Error(j.error||("The game server answered "+r.status));er.status=r.status;if(r.status>=500&&!j.error)er.net=true;throw er;}
  return j;
}

/* ---- phone alerts ---- */
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;
const pushCapable=()=>"serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window&&location.protocol==="https:";
function b64uBytes(s){s=String(s).replace(/-/g,"+").replace(/_/g,"/");s+="===".slice((s.length+3)%4);const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function bytesB64u(buf){const b=new Uint8Array(buf);let s="";for(const x of b)s+=String.fromCharCode(x);return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");}
function alertInfo(){
  if(!pushCapable()) return {k:"no",t:isIOS&&!standalone?"For turn alerts on iPhone: in Safari tap Share, then Add to Home Screen, and open 8-Ball from your Home Screen.":"This browser can't show turn alerts. Chrome works on Android; on iPhone use the Home Screen app."};
  if(Notification.permission==="denied") return {k:"denied",t:"Turn alerts are blocked. Allow notifications for 8-Ball in your phone's Settings, then come back here."};
  if(Notification.permission==="granted"&&NET.subOK) return {k:"on",t:"Turn alerts are on for this phone."};

}
const swReady=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,rej)=>setTimeout(()=>rej(new Error("the offline helper isn't running; reload the page")),8000))]);
async function syncPush(loud){
  if(!NET.prof||!pushCapable()||Notification.permission!=="granted") return;
  if(LSJ("eb-alerts-off")) return;   /* the player turned alerts off — don't re-subscribe on load */
  try{
    const reg=await swReady(), key=(await api("vapid",{},true)).key;
    let sub=await reg.pushManager.getSubscription();
    if(sub&&sub.options&&sub.options.applicationServerKey&&bytesB64u(sub.options.applicationServerKey)!==key){await sub.unsubscribe().catch(()=>{});sub=null;}
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(key)});
    await api("subscribe",{sub:sub.toJSON()}); NET.subOK=true;
  }catch(e){NET.subOK=false;if(loud)netMsg("Couldn't turn on alerts: "+e.message);}
}
function enableAlerts(){
  let p=null; try{p=Notification.requestPermission();}catch(e){}
  Promise.resolve(p).then(async perm=>{
    perm=perm||Notification.permission;
    if(perm!=="granted"){netMsg("Alerts weren't allowed. You can still play; just check back here for your turns.");frRender();return;}
    LSJ("eb-alerts-off",null);   /* the player wants alerts again */
    netMsg("Turning on alerts…"); await syncPush(true); if(NET.subOK)netMsg(""); frRender();
  });
}
async function disableAlerts(){
  /* turn alerts back off: remember the choice (so the quiet re-sync on
     load doesn't re-subscribe) and update the screen at once — the actual
     unsubscribe runs in the background, so a slow service worker never
     leaves the button looking stuck. The browser's notification
     permission stays granted (that's a phone setting), but with no
     subscription nothing is delivered — tapping "Turn on" later

  LSJ("eb-alerts-off",true);

  const seed=(Math.floor(Math.random()*2e9)+1)|0, S0=newTable(seed,g.me), enc=JSON.stringify(S0);
  await api("respond",{gid:g.id,accept:true,state:enc,seq:S0.n,turn:S0.turn,ver:EB_VER});
  enterGame(Object.assign({},g,{status:"active",state:enc,seq:S0.n,turn:S0.turn,prev:null,log:null,lastBy:-1,winner:-2}));
}
async function netDecline(g){try{await api("respond",{gid:g.id,accept:false});}catch(e){netMsg(e.message);}netRefresh();}
async function netHide(g){try{await api("hide",{gid:g.id});}catch(e){netMsg(e.message);}netRefresh();}
async function netOpen(gid){
  try{const g=await api("game",{gid});if(g.status==="invite"){netRefresh();return;}enterGame(g);}
  catch(e){netMsg(e.message);}
}

/* ---- playing a turn-by-turn game ---- */
const outbox=()=>LSJ("eb-outbox")||{};
function markSeen(id,seq){const s=LSJ("eb-seen")||{};if((s[id]||0)<seq){s[id]=seq;LSJ("eb-seen",s);}}
const wipGet=()=>LSJ("eb-wip");
function wipSet(){if(visit)LSJ("eb-wip",visit);else LSJ("eb-wip",null);}
function enterGame(g){
  leaveGame();
  G={id:g.id,me:g.me,opp:g.opp,seq:g.seq,status:g.status,winner:g.winner,chat:0,forfeit:false};
  mode="online"; myIdx=g.me; names=["",""]; names[myIdx]=(NET.prof&&NET.prof.name)||"You"; names[1-myIdx]=g.opp.name||"Friend";
  let stateStr=g.state; const ob=outbox()[g.id];
  if(ob&&ob.base>=g.seq){stateStr=ob.state;G.seq=ob.seq;if(ob.winner!==-2)G.status="over";}   /* our turn hasn't reached the server yet */
  let fin=null; try{fin=JSON.parse(stateStr);}catch(e){}
  if(!fin||!fin.b){G=null;mode="cpu";netMsg("This game couldn't be loaded.");return;}
  hideMenu(); startOnlineUi(); netChatLoad();
  if(g.status==="over"&&fin.win===-2&&g.winner>=-1){fin.win=g.winner;G.forfeit=true;fin.why="Gave up";}
  const seen=(LSJ("eb-seen")||{})[g.id]||0;
  /* an unfinished turn of ours (we shot, but the turn hadn't passed yet) */
  const wip=wipGet();
  if(!ob&&wip&&wip.gid===g.id&&wip.base===g.seq&&g.status==="active"&&g.turn===g.me){
    try{
      let T=JSON.parse(wip.prev); for(const s of wip.shots){const sh=unpackShot(s);const b16=T.b.map(p=>p?p.slice():0);if(sh.h)b16[0]=sh.h.slice();T=judge(T,simulateShot(b16,sh)).S;}
      visit=wip; S=T; replaying=false; markSeen(g.id,g.seq);
      if(S.turn!==myIdx||S.win!==-2) visitSend();   /* the turn had already passed when the app closed: send it now */
      beginTurn(); netPollStart(); return;
    }catch(e){visit=null;wipSet();}
  }
  if(!ob&&g.log&&g.prev&&g.lastBy>=0&&g.lastBy!==g.me&&seen<g.seq&&g.lver===EB_VER&&!G.forfeit){
    let shots=null,S0=null; try{shots=JSON.parse(g.log);S0=JSON.parse(g.prev);}catch(e){}
    if(shots&&shots.length&&S0&&S0.b){
      S=S0; repStart(S0,shots,JSON.stringify(fin),()=>{markSeen(g.id,g.seq);beginTurn();}); netPollStart(); return;
    }
  }
  S=fin; replaying=false; markSeen(g.id,g.seq); beginTurn(); netPollStart();
  if(g.ver>EB_VER) netMsg("Your friend has a newer version of 8-Ball. Reload the page to update.");
  if(ob) flushOutbox(false);
}
function leaveGame(){
  clearInterval(NET.gpT); G=null; visit=null; rep=null; replaying=false; showReplayTag(false);
}
function visitBegin(){
  if(!G) return;
  if(visit&&visit.gid===G.id&&visit.base===G.seq) return;
  visit={gid:G.id,base:G.seq,prev:JSON.stringify(S),shots:[]}; wipSet();
}
function visitShot(shot){ if(!visit) return; visit.shots.push(packShot(shot)); wipSet(); }
function visitSend(){
  if(!G||!visit) return;
  const body={gid:G.id,base:visit.base,seq:S.n,turn:S.turn,winner:S.win,state:JSON.stringify(S),prev:visit.prev,log:JSON.stringify(visit.shots),ver:EB_VER};
  G.seq=S.n; if(S.win!==-2) G.status="over";
  const ob=outbox(); ob[G.id]=body; LSJ("eb-outbox",ob);
  visit=null; wipSet(); markSeen(body.gid,body.seq);
  flushOutbox(true);
}
function netGameOver(){ if(G&&visit) visitSend(); }
async function flushOutbox(fromTurn){
  if(flushing) return; const ob=outbox(), ids=Object.keys(ob); if(!ids.length) return;
  flushing=true;
  for(const id of ids){
    const body=ob[id];
    try{
      await api("turn",body); const o2=outbox(); delete o2[id]; LSJ("eb-outbox",o2);
      if(fromTurn&&G&&G.id===id) toast(body.winner===-2?"Turn sent. "+G.opp.name+" gets an alert.":"Result sent.","#9ff6ff");
    }catch(e){
      if(e.net||e.nosrv){if(fromTurn)toast("No connection. Your turn is saved and will be sent when you're back online.","#ffb04a");setTimeout(()=>flushOutbox(false),15000);break;}
      const o2=outbox(); delete o2[id]; LSJ("eb-outbox",o2);
      if(G&&G.id===id){toast(e.message,"#ff8a6a");api("game",{gid:id}).then(g=>{if(G&&G.id===id&&!visit)enterGame(g);}).catch(()=>{});}
    }
  }
  flushing=false;
}
function netPollStart(){clearInterval(NET.gpT);NET.gpT=setInterval(netPoll,4000);}
async function netPoll(){
  if(!G||mode!=="online"){clearInterval(NET.gpT);return;}
  if(document.visibilityState!=="visible") return;
  const id=G.id;
  try{
    const p=await api("peek",{gid:id});
    if(!G||G.id!==id) return;
    if((p.chat|0)>(G.chat|0)) netChatNew();
    if(rep||replaying||visit||flushing||outbox()[id]||phase==="roll"||phase==="script") return;
    if(p.seq>G.seq||(p.status==="over"&&G.status!=="over")){const g=await api("game",{gid:id});if(G&&G.id===id&&!rep&&!visit&&phase!=="roll")enterGame(g);}
  }catch(e){}
}
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&G)netPoll();});
async function netForfeit(){
  if(!G) return; const id=G.id;
  try{await api("forfeit",{gid:id});}catch(e){toast(e.message,"#ff8a6a");return;}
  try{const g=await api("game",{gid:id});enterGame(g);}catch(e){}
}
/* ---- chat in a game ---- */
async function netChatLoad(){
  if(!G) return; const id=G.id; chatLog.length=0; chatUnread=0; chatRender(); chatDot();
  try{
    const r=await api("chat",{gid:id,after:0}); if(!G||G.id!==id) return;
    const seen=(LSJ("eb-chatseen")||{})[id]||0; let unread=0,last=null; chatLog.length=0;
    for(const m of r.msgs){chatLog.push({mine:m.team===myIdx,text:m.text});if(m.team!==myIdx&&m.id>seen){unread++;last=m.text;}G.chat=Math.max(G.chat|0,m.id);}
    if(chatLog.length>40) chatLog.splice(0,chatLog.length-40);
    chatRender(); chatUnread=unread; chatDot(); if(unread) chatPopup(last);
  }catch(e){}
}
let chatFetching=false;
async function netChatNew(){
  if(!G||chatFetching) return; const id=G.id; chatFetching=true;
  try{
    const r=await api("chat",{gid:id,after:G.chat|0}); if(!G||G.id!==id) return;
    for(const m of r.msgs){
      G.chat=Math.max(G.chat|0,m.id);
      if(m.team===myIdx) continue;
      chatLog.push({mine:false,text:m.text}); if(chatLog.length>40) chatLog.shift();
      if(!chatIsOpen()){chatUnread++;chatDot();chatPopup(m.text);} else netChatSeen();
      SFX.chat();
    }
    chatRender();
  }catch(e){}
  chatFetching=false;
}
function netChatSeen(){if(!G)return;const s=LSJ("eb-chatseen")||{};s[G.id]=G.chat|0;LSJ("eb-chatseen",s);}
async function netSay(text){
  if(!G) return; chatLog.push({mine:true,text}); chatRender();
  try{const r=await api("say",{gid:G.id,text}); if(r&&r.id) G.chat=Math.max(G.chat|0,r.id);}catch(e){toast(e.message,"#ff8a6a");}
}

/* ===== play.js ===== */
/* =====================================================================
   PLAY: the game flow (whose turn, aiming, shooting, replaying a friend's
   shots), the touch controls, and the frame loop.
   phase: title | place | aim | script (a cue stroke is being shown) | roll (balls moving)
          | cpu (the computer is thinking) | wait (online: the friend is shooting) | over
   ===================================================================== */
let S=null, phase="title", mode="cpu", names=["Player 1","Player 2"], myIdx=0, cpuLevel=1;
let sim=null, cuePos=[HEAD_X,MID_Y], aimA=0, pull=0, power=0, spin=[0,0], cueShow=true;
let replaying=false, chatUnread=0, msgText="", msgT=0, anim=null, rep=null, accT=0, ovl=0, fineDir=0, fineT=0;
const timers=[];
const after=(sec,fn)=>{timers.push({t:sec,fn});};
const isHuman=p=>mode==="local"||(mode==="cpu"?p===0:p===myIdx);
const canAct=()=>!!S&&!replaying&&ovl===0&&(phase==="aim"||phase==="place")&&isHuman(S.turn);
const ease=k=>k<0?0:k>1?1:k*k*(3-2*k);

/* ---- what the status strip says ---- */
function statusText(){
  if(!S||phase==="title"||phase==="over") return "";
  if(msgT>0&&msgText) return msgText;
  const who=(names[S.turn]||"").slice(0,9);
  if(phase==="place") return canAct()?(S.hand===1?"Place behind line":"Place the cue ball"):who+" places";
  if(phase==="cpu") return who+" is thinking";
  if(phase==="wait") return "Waiting for "+who;
  /* the aim phase shows no status at all — the turn is already shown by
     the player panels, and the strip sits over the top of the table. */
  return "";
}
function say(t,sec){msgText=t;msgT=sec||2.2;}

/* ---- starting a table ---- */
function startTable(m,seed,first,nm,my){
  mode=m; names=nm; myIdx=my|0; S=newTable(seed,first); replaying=false; rep=null; sim=null; anim=null; timers.length=0; resetOrient(); cancelSettle(); resetTray(); trailClear();
  beginTurn(); saveLocal();
}
function beginTurn(){
  sim=null; anim=null; accT=0; pull=0; power=0; spin=[0,0]; fineDir=0;
  /* safety net on top of the settle animation: by the time a turn
     begins the numbers must face the camera dead-on, so they read.
     If the settle was cut short (a quick next shot, a resume), a ball
     can be left with its number turned away and read as the wrong
     digit — a 4 or an 8 showing as a bare "1". Snapping here makes
     the numbers unmissable whenever the player is aiming. */
  resetOrient(); cancelSettle();
  if(!S) return;
  if(S.win!==-2){endGame();return;}
  cuePos=S.b[0].slice();
  if(isHuman(S.turn)){
    if(mode==="online") visitBegin();
    if(S.hand&&!S.brk) startPlace(); else startAim();
  } else if(mode==="cpu"){
    phase="cpu"; cueShow=false; after(0.9,cpuTurn);
  } else { phase="wait"; cueShow=false; }
  /* an online game that hasn't started yet: say who breaks, so both
     phones agree on the opening turn (the accepter breaks first). Only
     at the very start — once the break is taken S.brk is false and S.n>0. */
  if(mode==="online"&&S.brk&&S.n===0) say(S.turn===myIdx?"You break first":"Friend breaks first",3);
  saveLocal();
}
function startAim(){
  phase="aim"; cueShow=true; power=0; pull=0; spin=[0,0]; cuePos=S.b[0].slice(); aimA=defaultAim();
}
function startPlace(keep){
  phase="place"; cueShow=false; cuePos=(keep&&cueSpotOK(S,cuePos[0],cuePos[1]))?cuePos.slice():placeDefault();
}
function placeDefault(){
  let c=S.b[0].slice(); if(cueSpotOK(S,c[0],c[1])) return c;
  for(let r=0;r<60;r+=2) for(let k=0;k<12;k++){const a=k*0.5236,x=q2(c[0]+Math.cos(a)*r),y=q2(c[1]+Math.sin(a)*r);if(cueSpotOK(S,x,y)) return [x,y];}
  return c;
}
function legalTargets(S0,who){
  const t=targetOf(S0,who), out=[];
  for(let i=1;i<16;i++){ if(!S0.b[i]) continue; if(t==="open"?i!==8:t==="eight"?i===8:groupOf(i)===t) out.push(i); }
  return out;
}
function defaultAim(){
  const c=cuePos, L=legalTargets(S,S.turn); let best=-1,bd=1e9;
  for(const i of L){const p=S.b[i],d=sqr(p[0]-c[0])+sqr(p[1]-c[1]);if(d<bd){bd=d;best=i;}}
  if(S.brk||best<0) return Math.atan2(MID_Y-c[1],FOOT_X-c[0]);
  return Math.atan2(S.b[best][1]-c[1],S.b[best][0]-c[0]);
}

/* ---- shooting ---- */
function fire(){
  if(!canAct()||phase!=="aim"||power<0.04){power=0;pull=0;return;}
  const raw={ux:Math.cos(aimA),uy:Math.sin(aimA),p:power,sx:spin[0],sy:spin[1],h:S.hand>0?cuePos:null};
  const shot=unpackShot(packShot(raw));
  if(mode==="online") visitShot(shot);
  strike(shot);
}
/* the cue slides forward, then the balls start to move */
function strike(shot){
  phase="script"; cueShow=true; aimA=Math.atan2(shot.uy,shot.ux); spin=[shot.sx,shot.sy]; power=shot.p;
  anim={stage:"strike",t:0,shot,from:pull};
}
function startSim(shot){
  PRV.fill(0); TRAIL.last.fill(null); TRAIL.idle=0;
  cancelSettle();   /* a new shot starts: the balls roll from wherever they settled */
  const b16=S.b.map(p=>p?p.slice():0); if(shot.h) b16[0]=shot.h.slice();
  sim=new Sim(b16,true); sim.shoot(shot.ux,shot.uy,shot.p,shot.sx,shot.sy);
  phase="roll"; cueShow=false; accT=0; pull=0; power=0;
}
function rollStep(dt){
  accT=Math.min(accT+dt,0.06); let n=Math.floor(accT*240); accT-=n/240; let done=false;
  RDX.fill(0); RDY.fill(0);
  while(n-->0){
    /* remember where every ball was before this step: the picture is interpolated between the last two steps */
    for(let i=0;i<16;i++){const b=sim.b[i]; if(b.alive){PRX[i]=b.x;PRY[i]=b.y;PRV[i]=1;} else PRV[i]=0;}
    sim.step();
    for(let i=0;i<16;i++){const b=sim.b[i]; if(b.alive){RDX[i]+=b.vx*STEP;RDY[i]+=b.vy*STEP;}}
    if(!sim.moving()||sim.steps>=MAX_STEPS){done=true;break;}
  }
  /* roll the balls' orientations with the physics, once per frame: a ball that travelled (dx,dy) turns |d|/BR radians around the horizontal axis at right angles to its travel. View state only — it never touches the deterministic sim, so it can't change a shot's outcome. */
  for(let i=0;i<16;i++){const L=Math.sqrt(RDX[i]*RDX[i]+RDY[i]*RDY[i]); if(L>0.004) rotOrient(ORIENT[i],-RDY[i]/L,RDX[i]/L,0,L/BR);}
  ALPHA=Math.min(1,accT*240);
  for(const e of sim.ev) fxEvent(e);
  sim.ev.length=0;
  if(done) finishShot();
}
function fxEvent(e){
  if(e.k==="cue"){SFX.cue(e.p);addSpark(e.x,e.y,4,"#cfe8ff");}
  else if(e.k==="ball"){SFX.ball(e.v);if(e.v>180)addSpark(e.x,e.y,Math.min(6,Math.round(e.v/90)));}
  else if(e.k==="rail") SFX.rail(e.v);
  else if(e.k==="pocket"){SFX.pocket();const xy=POCKET_XY[e.p];SINKS.push({n:e.ball,x:e.x,y:e.y,tx:xy[0],ty:xy[1],t:0});addSpark(xy[0],xy[1],8,sparkCol());pocketFx(e.p);if(e.ball>=1) rollBallToTray(e.ball,xy[0],xy[1]);}
}
function finishShot(){
  const res={balls:sim.snapshot(),firstHit:sim.firstHit,railAfter:sim.railAfter,pocketed:sim.pocketed.slice()};
  const was=S.turn, J=judge(S,res); S=J.S; sim=null; accT=0; cuePos=S.b[0].slice();
  startSettle();   /* balls stopped: ease every number back to face-up so they read again */
  if(S.win!==-2){ after(0.9,()=>replaying?repNext():(mode==="online"&&visitSend(),beginTurn())); return; }
  if(J.foul){
    SFX.foul(); addCall("Foul","#ff6a5a",20,1.5);
    const n=(J.notes[0]||""); say(n.startsWith("Scratch")?"Scratch":n.startsWith("No ball hit")?"Missed the balls":n.startsWith("No ball reached")?"No ball hit a rail":n.startsWith("Hit the wrong ball:")?"The 8 comes last":n.startsWith("Hit")?"Wrong ball first":"Foul",2.6);
  }
  if(!J.foul&&S.n>0&&J.continues) say("Shoot again",1.6);
  /* the table was open and this pot picked the groups */
  const gAfter=S.groups[was]; if(gAfter>=0&&anim_openBefore){say(names[was].slice(0,9)+": "+GROUP_NAME[gAfter],2.6);}
  anim_openBefore=false;
  if(S.turn!==was&&!J.foul) SFX.turn();
  after(replaying?0.7:0.85,()=>{ if(replaying) repNext(); else {if(mode==="online"&&(S.turn!==myIdx)) visitSend(); beginTurn();} });
}
let anim_openBefore=false;
function animStep(dt){
  const a=anim; a.t+=dt;
  if(a.stage==="draw"){            /* the cue is drawn back (a replayed or computer shot) */
    const k=a.t/a.dur; pull=a.shot.p*ease(k);
    if(k>=1){a.stage="hold";a.t=0;}
  } else if(a.stage==="hold"){
    if(a.t>=0.18){a.stage="strike";a.t=0;a.from=pull;}
  } else if(a.stage==="strike"){
    const k=Math.min(1,a.t/0.07); pull=a.from*(1-k)-0.09*k;
    if(k>=1){const shot=a.shot; anim=null; anim_openBefore=S.groups[0]<0; startSim(shot);}
  }
}
/* a shot played by the screen (the computer's, or a friend's being replayed) */
function scriptShot(shot){
  phase="script"; cueShow=true; sim=null;
  cuePos=(shot.h?shot.h.slice():S.b[0].slice()); if(shot.h) SFX.place();
  aimA=Math.atan2(shot.uy,shot.ux); spin=[shot.sx,shot.sy]; power=shot.p; pull=0;
  anim={stage:"draw",t:0,dur:0.35+0.5*shot.p,shot};
}
function cpuTurn(){
  if(phase!=="cpu") return;
  const sh=cpuPlan(S,cpuLevel); scriptShot(sh);
}

/* ---- watching a friend's shots (online) ---- */
function repStart(S0,shots,authStr,done){
  rep={S0,shots,i:0,auth:authStr,done}; S=JSON.parse(JSON.stringify(S0)); replaying=true; timers.length=0; resetOrient(); cancelSettle(); resetTray(); trailClear();
  names=names.slice(); cueShow=false; phase="script"; showReplayTag(true);
  after(0.9,repNext);
}
function repNext(){
  if(!rep) return;
  if(rep.i>=rep.shots.length){repFinish();return;}
  scriptShot(unpackShot(rep.shots[rep.i++]));
}
function repFinish(){
  const r=rep; rep=null; replaying=false; showReplayTag(false); anim=null; sim=null;
  const mine=JSON.stringify(S);
  S=JSON.parse(r.auth); if(mine!==r.auth) window.__ebMismatch=(window.__ebMismatch|0)+1;
  if(r.done) r.done(); else beginTurn();
}
function repSkip(){
  if(!rep) return; timers.length=0; anim=null; sim=null; repFinish();
}
function showReplayTag(on){const t=document.getElementById("replayTag");if(!t)return;t.hidden=!on;if(on)t.textContent="Watching "+(names[1-myIdx]||"your friend")+"'s turn";}

/* ---- the end of a game ---- */
function endGame(){
  phase="over"; cueShow=false; sim=null; anim=null;
  const w=S.win, mine=mode==="local"?true:mode==="cpu"?w===0:w===myIdx;
  if(mode==="local") SFX.win(); else if(mine) SFX.win(); else SFX.lose();
  const nm=names[w].slice(0,12);
  addCall(mode==="local"?nm+" wins":mine?"You win!":"You lose",mine?"#7dff8a":"#ff6a5a",20,3);
  if(mode==="online") netGameOver(); else clearLocal();
  showOver();
}

/* ---- saving a game against the computer or a friend on this phone ---- */
function saveLocal(){
  if(mode==="online"||!S||S.win!==-2) return;
  try{localStorage.setItem("eb-save",JSON.stringify({mode,names,cpuLevel,S}));}catch(e){}
}
function clearLocal(){try{localStorage.removeItem("eb-save");}catch(e){}}
function loadLocal(){try{return JSON.parse(localStorage.getItem("eb-save")||"null");}catch(e){return null;}}

/* ---- touch / mouse controls ---- */
const ptrs=new Map();
function tablePt(bx,by){return [bx-FX,by-FY];}
function overTable(bx,by){return bx>=OX&&bx<OX+TBL_W&&by>=OY&&by<OY+TBL_H;}
function setAimFrom(bx,by){
  const [tx,ty]=tablePt(bx,by); const dx=tx-cuePos[0],dy=ty-cuePos[1];
  if(dx*dx+dy*dy>25) aimA=Math.atan2(dy,dx);
}
let touchLift=0;
function setPlaceFrom(bx,by){
  let [tx,ty]=tablePt(bx,by); ty-=touchLift;   /* with a finger, the ball sits just above it so you can see it */ const maxX=S.hand===1?HEAD_X:TW-BR;
  tx=q2(clamp(tx,BR,maxX)); ty=q2(clamp(ty,BR,TH-BR)); cuePos=[tx,ty];
}
function setSpinFrom(bx,by){
  const Sp=CTL.spin; let sx=(bx-Sp.cx)/(Sp.r-3), sy=-(by-Sp.cy)/(Sp.r-3); const l=Math.sqrt(sx*sx+sy*sy); if(l>1){sx/=l;sy/=l;}
  spin=[Math.round(sx*100)/100,Math.round(sy*100)/100];
}
function setPowerFrom(by){const P=CTL.power; power=clamp((P.y+P.h-by)/P.h,0,1); pull=power;}
cv.addEventListener("pointerdown",e=>{
  audioInit(); e.preventDefault(); if(phase==="title"||!S) return;
  const [x,y]=toBuf(e.clientX,e.clientY); touchLift=e.pointerType==="touch"?9:0;
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(inRect(CTL.menu,x,y)){SFX.click();ptrs.set(e.pointerId,{k:"menu"});return;}
  if(mode==="online"&&inRect(CTL.chat,x,y)&&ovl===0){SFX.click();ptrs.set(e.pointerId,{k:"chat"});return;}
  if(replaying&&inRect(CTL.skip,x,y)){SFX.click();ptrs.set(e.pointerId,{k:"skip"});return;}
  if(!canAct()) return;
  if((phase==="place"||(phase==="aim"&&S.hand>0))&&inRect(CTL.ok,x,y)){ptrs.set(e.pointerId,{k:"ok"});return;}
  if(phase==="place"){ if(overTable(x,y)){setPlaceFrom(x,y);ptrs.set(e.pointerId,{k:"place"});} return; }
  /* aiming */
  const P=CTL.power;
  if(x>=P.x-11&&x<=P.x+P.w+11&&y>=P.y-6&&y<=P.y+P.h+2){setPowerFrom(y);ptrs.set(e.pointerId,{k:"power"});return;}
  for(const [nm,d] of [["fineL",-1],["fineR",1]]) if(inRect(CTL[nm],x,y)){fineDir=d;fineT=0;aimA+=d*0.0017;ptrs.set(e.pointerId,{k:"fine",d});return;}
  const Sp=CTL.spin; if(sqr(x-Sp.cx)+sqr(y-Sp.cy)<=sqr(Sp.r+4)){setSpinFrom(x,y);ptrs.set(e.pointerId,{k:"spin"});return;}
  if(overTable(x,y)){setAimFrom(x,y);ptrs.set(e.pointerId,{k:"aim"});}
});
cv.addEventListener("pointermove",e=>{
  const p=ptrs.get(e.pointerId); if(!p||!S) return; const [x,y]=toBuf(e.clientX,e.clientY);
  if(!canAct()&&p.k!=="menu"&&p.k!=="chat"&&p.k!=="skip") return;
  if(p.k==="power") setPowerFrom(y); else if(p.k==="aim") setAimFrom(x,y); else if(p.k==="spin") setSpinFrom(x,y);
  else if(p.k==="place") setPlaceFrom(x,y);
});
function ptrUp(e,cancel){
  const p=ptrs.get(e.pointerId); if(!p) return; ptrs.delete(e.pointerId); const [x,y]=toBuf(e.clientX,e.clientY);
  if(p.k==="power"){ if(cancel||power<0.04){power=0;pull=0;} else fire(); }
  else if(p.k==="fine") fineDir=0;
  else if(p.k==="menu"&&!cancel&&inRect(CTL.menu,x,y)) openPause();
  else if(p.k==="chat"&&!cancel&&inRect(CTL.chat,x,y)) openChat();
  else if(p.k==="skip"&&!cancel&&inRect(CTL.skip,x,y)) repSkip();
  else if(p.k==="ok"&&!cancel&&inRect(CTL.ok,x,y)&&canAct()){
    if(phase==="place"){if(cueSpotOK(S,cuePos[0],cuePos[1])){SFX.place();const keep=cuePos.slice();startAim();cuePos=keep;aimA=defaultAim();}}
    else {SFX.click();startPlace(true);}
  }
}
cv.addEventListener("pointerup",e=>ptrUp(e,false));
cv.addEventListener("pointercancel",e=>ptrUp(e,true));
/* keyboard, for playing on a computer */
const keys={};
addEventListener("keydown",e=>{
  if(e.target&&e.target.tagName==="INPUT") return; keys[e.key]=true;
  if(!canAct()||phase!=="aim") return;
  if(e.key==="ArrowUp"){power=clamp(power+0.05,0,1);pull=power;e.preventDefault();}
  else if(e.key==="ArrowDown"){power=clamp(power-0.05,0,1);pull=power;e.preventDefault();}
  else if(e.key===" "||e.key==="Enter"){e.preventDefault();if(power<0.04){power=0.5;pull=0.5;}fire();}
});
addEventListener("keyup",e=>{keys[e.key]=false;});

/* ---- the frame loop ---- */
let lastTs=0;
function update(dt){
  stepFx(dt); if(msgT>0) msgT-=dt;
  for(let i=timers.length-1;i>=0;i--){const t=timers[i];t.t-=dt;if(t.t<=0){timers.splice(i,1);t.fn();}}
  if(S&&canAct()&&phase==="aim"){
    let d=fineDir; if(keys.ArrowLeft) d=-1; else if(keys.ArrowRight) d=1;
    if(d){fineT+=dt;aimA+=d*(0.04+Math.min(0.26,fineT*0.13))*dt;}   /* a slow turn that speeds up the longer you hold */
    else fineT=0;
  }
  if(anim) animStep(dt);
  if(phase==="roll"&&sim) rollStep(dt);
  /* the felt rumble follows the balls: loud while they're flying, silent
     once they stop. */
  if(sim&&phase==="roll"){
    let sp=0; for(let i=0;i<16;i++){const b=sim.b[i]; if(b&&b.alive) sp+=Math.sqrt(b.vx*b.vx+b.vy*b.vy);}
    SFX.roll(Math.min(1,sp/1500));
  }else SFX.roll(0);
  updateSettle(dt);
}
function frame(ts){
  const dt=Math.min(0.05,Math.max(0,(ts-lastTs)/1000||0.016)); lastTs=ts; FXT+=dt;
  update(dt);
  ensureArt();
  /* the title screen's logo and rack are DOM (#titleLeft) — show them
     only on the title screen, hide them the moment a game starts. */
  const onTitle=phase==="title"||!S;
  if(onTitle) drawTitle(dt); else drawGame(dt);
  $("titleLeft").hidden=!onTitle;
  syncHud();
  requestAnimationFrame(frame);
}
